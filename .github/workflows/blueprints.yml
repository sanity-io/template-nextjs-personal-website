name: Sanity Blueprints

# Deploys `sanity.blueprint.ts` (the sync tag invalidate function in `functions/`) on pushes to
# main, and posts a plan preview on pull requests. Both jobs are skipped until the repository
# variables SANITY_BLUEPRINT_STACK_ID and NEXT_PUBLIC_SANITY_PROJECT_ID are set. The token comes
# from `npx sanity blueprints mint-deploy-token --print`, stored as the SANITY_DEPLOY_TOKEN secret.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# The blueprint scopes the function to this dataset, so both jobs must see the same values.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.SANITY_BLUEPRINT_STACK_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: sanity-io/blueprints-actions/plan@plan-v2
        with:
          sanity-token: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          stack-id: ${{ vars.SANITY_BLUEPRINT_STACK_ID }}
          project-id: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}

  deploy:
    if: github.event_name != 'pull_request' && vars.SANITY_BLUEPRINT_STACK_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: sanity-io/blueprints-actions/deploy@deploy-v3
        with:
          sanity-token: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          stack-id: ${{ vars.SANITY_BLUEPRINT_STACK_ID }}
          project-id: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
