name: Sanity Blueprints

# Deploys the Studio schema and `sanity.blueprint.ts` (the functions in `functions/`) on pushes to
# main, and posts a plan preview on pull requests. Both jobs are skipped until the repository
# variable SANITY_BLUEPRINT_STACK_ID is set. Required repository configuration:
#   variables: SANITY_BLUEPRINT_STACK_ID, NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET,
#              REVALIDATE_URL (https://<your-site>/api/revalidate)
#   secrets:   SANITY_DEPLOY_TOKEN (`npx sanity blueprints mint-deploy-token --print`),
#              SANITY_REVALIDATE_SECRET (same value as the Next.js deployment)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# sanity.blueprint.ts reads these: the first two scope the function to the dataset, the last two
# become the deployed function's environment (they must match the Next.js deployment's
# SANITY_REVALIDATE_SECRET and public URL). Both jobs get them so plan and deploy agree.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
  REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
  SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.SANITY_BLUEPRINT_STACK_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: sanity-io/blueprints-actions/plan@plan-v2
        with:
          sanity-token: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          stack-id: ${{ vars.SANITY_BLUEPRINT_STACK_ID }}
          project-id: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}

  deploy:
    if: github.event_name != 'pull_request' && vars.SANITY_BLUEPRINT_STACK_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Agent Actions read the schema deployed to the dataset, so it ships with the functions that
      # call them. The blueprints-deployer role carries the deployStudio grant this needs.
      - run: npx sanity schema deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
      - uses: sanity-io/blueprints-actions/deploy@deploy-v3
        with:
          sanity-token: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          stack-id: ${{ vars.SANITY_BLUEPRINT_STACK_ID }}
          project-id: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
